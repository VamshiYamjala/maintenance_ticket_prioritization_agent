services:
  - type: web
    name: greenko-ticket-triage-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m backend.evaluate
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: LLM_PROVIDER
        value: none
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_API_KEY
        sync: false
